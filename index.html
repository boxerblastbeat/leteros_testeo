        const isSqm = w > 0 && h > 0;
        const area = isSqm ? (w * h) : 1;

        // Costo base del sustrato
        const baseCost = isSqm ? (w * h * qty * price) : (qty * price);

        // Sumar capas de la Composición del Letrero (Submateriales montados: ej. Foam + Adhesivo + Laminado)
        const compositionSelected = [];
        let compositionTotal = 0;
        Object.keys(compositionLayers).forEach(key => {
          const layer = compositionLayers[key];
          if (layer.active) {
            const lPrice = parseFloat(layer.price) || 0;
            const cost = layer.perSqm && isSqm ? Math.round(lPrice * area * qty) : Math.round(lPrice * qty);
            compositionTotal += cost;
            const priceTag = layer.perSqm && isSqm ? `+$${lPrice.toLocaleString('es-CL')}/m²` : `+$${lPrice.toLocaleString('es-CL')}`;
            compositionSelected.push(`${layer.label} (${priceTag})`);
          }
        });

        // Sumar acabados e iluminación seleccionados con precios editados por el usuario
        const selectedFinishesList = [];
        let finishesTotal = 0;

        Object.keys(finishesState).forEach(key => {
          const f = finishesState[key];
          if (f.active) {
            const fPrice = parseFloat(f.price) || 0;
            const cost = f.perSqm && isSqm ? Math.round(fPrice * area * qty) : Math.round(fPrice * qty);
            finishesTotal += cost;
            const formattedPrice = f.perSqm && isSqm ? `+$${fPrice.toLocaleString('es-CL')}/m²` : `+$${fPrice.toLocaleString('es-CL')}`;
            selectedFinishesList.push(`${f.label} (${formattedPrice})`);
          }
        });

        const subtotal = Math.round(baseCost + compositionTotal + finishesTotal);
        const unitPiecePrice = qty > 0 ? Math.round(subtotal / qty) : subtotal;

        // Componer detalle técnico unificado de la composición del letrero
        let combinedDetail = (itemDetail || '').trim();
        if (compositionSelected.length > 0) {
          const compositionNote = `Composición del Letrero: [Base: ${desc}] + ` + compositionSelected.map(s => s.split(' (')[0]).join(' + ');
          combinedDetail = combinedDetail ? `${combinedDetail} | ${compositionNote}` : compositionNote;
        }

        const newItem = {
          id: 'item-' + Date.now(),
          productId: selectedCatalogId || 'custom-item',
          name: desc,
          detail: combinedDetail,
          calcType: isSqm ? 'sqm' : 'unit',
          width: isSqm ? w : null,
          height: isSqm ? h : null,
          quantity: qty,
          unitPrice: price,
          unitPiecePrice: unitPiecePrice,
          unitLabel: isSqm ? 'm²' : 'unidad',
          compositionLayers: compositionSelected,
          selectedOptions: selectedFinishesList,
          optionsTotal: compositionTotal + finishesTotal,
          subtotal: subtotal
        };

        setQuoteItems([...quoteItems, newItem]);
        setItemDetail('');

        // Desmarcar capas de composición manteniendo precios configurados
        setCompositionLayers(prev => {
          const reset = {};
          Object.keys(prev).forEach(k => {
            reset[k] = { ...prev[k], active: false };
          });
          return reset;
        });

        // Desmarcar checkboxes de acabados manteniendo los precios editados
        setFinishesState(prev => {
          const reset = {};
          Object.keys(prev).forEach(k => {
            reset[k] = { ...prev[k], active: false };
          });
          return reset;
        });

        showToast('✅ Ítem añadido a la cotización');
      };

        const currentYear = new Date().getFullYear();
        const rawClient = quote?.client?.name || 'Cliente';
        const cleanClient = rawClient
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-zA-Z0-9\s-_]/g, '')
          .trim()
          .replace(/\s+/g, '_');
        const correlative = quote?.correlative || `COT-${currentYear}-0001`;
        return `Cotizacion_${currentYear}_${correlative}_${cleanClient}`;
      };

          timestamp: Date.now(),

          totals: { ...financialTotals },
          discountAmount,
          taxRate,
          status: isEditing ? 'Actualizada' : 'Emitida'

        if (intranetClientData.name || intranetClientData.documentId) {
          const cName = (intranetClientData.name || '').trim();
          const cRut = (intranetClientData.documentId || '').trim();
          setClientsMaster(prev => {

            if (idx >= 0) {
              const updated = [...prev];
              updated[idx] = {

                email: intranetClientData.email || updated[idx].email,

                address: intranetClientData.deliveryAddress || ''

            const exists = prev.some(q => q.correlative === targetCorrelative);
            if (exists) {
              next = prev.map(q => q.correlative === targetCorrelative ? quoteRecord : q);
            } else {
              next = [quoteRecord, ...prev];
            }

            next = [quoteRecord, ...prev.filter(q => q.correlative !== targetCorrelative)];

          try {
            localStorage.setItem('olivar_quotes_history', JSON.stringify(next));

            console.error('Error guardando historial en localStorage:', e);
          }
          return next;
        });

            try {
              localStorage.setItem('olivar_correlative', nextNum.toString());
              localStorage.setItem('letreros_olivar_folio_num', nextNum.toString());

            return nextNum;
          });

        handleOpenPrintModal(quoteRecord);

                    <button
                      type="submit"
                      className="px-5 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-extrabold rounded-xl transition shadow-lg shadow-red-600/30"
                    >
                      Ingresar a Intranet
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL / VISTA DE IMPRESIÓN Y PDF FORMAL A4 (OPTIMIZADO 1 PÁGINA) */}
          {/* ============================================================== */}
          {showPrintModal && currentQuoteToPrint && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
              <div className="bg-white text-black rounded-2xl w-full max-w-4xl my-4 overflow-hidden shadow-2xl flex flex-col">
                {/* Barra de control en pantalla (no se imprime) */}
                <div className="bg-zinc-950 text-white p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 no-print border-b border-zinc-800">
                  <div className="flex items-center gap-2.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                    <span className="font-bold text-xs sm:text-sm font-heading">
                      Cotización Oficial Letreros Olivar ({currentQuoteToPrint.correlative})
                    </span>
                    <span className="hidden md:inline-block text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 font-mono">
                      📁 Guardar PDF como: {getQuotePdfFileName(currentQuoteToPrint)}.pdf
                    </span>
                    <span className="hidden lg:inline-flex text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 font-mono items-center gap-1">
                      <span>🔒 Valores m² ocultos en impresión</span>
                    </span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handlePrintQuote}
                      className="bg-red-600 hover:bg-red-500 text-white font-extrabold px-4 py-1.5 rounded-xl text-xs flex items-center gap-1.5 transition shadow-lg shadow-red-600/30"
                    >
                      <Icon name="printer" className="w-4 h-4" />
                      <span>Imprimir / Guardar PDF (1 Pág)</span>
                    </button>
                    <button
                      onClick={handleClosePrintModal}
                      className="text-zinc-400 hover:text-white p-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 transition"
                      title="Cerrar vista previa"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {/* Hoja de Impresión A4 compacta (1 página asegurada) */}
                <div id="print-area" className="p-6 sm:p-8 space-y-4 bg-white text-black text-xs leading-normal">
                  
                  {/* Encabezado: Logo, Datos Empresa y Correlativo */}
                  <div className="flex justify-between items-start border-b-2 border-black pb-3">
                    <div>
                      <div className="flex items-center gap-2.5 mb-1">
                        <BrandLogo theme="light" className="h-10 sm:h-12 w-auto" />
                        <span className="text-[10px] font-bold text-zinc-500 font-mono">SpA</span>
                      </div>
                      <p className="text-[11px] font-bold text-zinc-800 tracking-wider uppercase">{companyInfo.tagline}</p>
                      <p className="text-[10px] text-zinc-600 mt-0.5">{companyInfo.address} • Tel: {companyInfo.phone}</p>
                      <p className="text-[10px] text-zinc-600 font-mono">RUT: {companyInfo.rut} • {companyInfo.email} • {companyInfo.web}</p>
                    </div>
                    <div className="text-right">
                      <div className="border-2 border-red-600 px-3 py-1.5 rounded-lg bg-red-50/80 inline-block text-right">
                        <span className="text-[9px] font-black text-zinc-700 uppercase tracking-widest block">COTIZACIÓN OFICIAL</span>
                        <span className="text-xl font-mono font-black text-red-600">{currentQuoteToPrint.correlative}</span>
                      </div>
                      <p className="text-[10px] text-zinc-700 mt-1"><strong>Emisión:</strong> {currentQuoteToPrint.date}</p>
                      <p className="text-[10px] text-zinc-700"><strong>Validez:</strong> {currentQuoteToPrint.client.validDays || 15} días</p>
                    </div>
                  </div>

                  {/* Datos del Cliente y Condiciones */}
                  <div className="grid grid-cols-2 gap-4 bg-zinc-50 p-3 rounded-lg border border-zinc-200 text-[11px]">
                    <div>
                      <span className="text-[9px] uppercase font-bold text-red-600 tracking-wider block">DATOS DEL CLIENTE:</span>
                      <strong className="text-xs text-black block mt-0.5">{currentQuoteToPrint.client.name}</strong>
                      {currentQuoteToPrint.client.contactPerson && (
                        <p className="text-zinc-800 font-medium"><strong>Atención:</strong> {currentQuoteToPrint.client.contactPerson}</p>
                      )}
                      {currentQuoteToPrint.client.documentId && <p className="text-zinc-700 font-mono">RUT: {currentQuoteToPrint.client.documentId}</p>}
                      <p className="text-zinc-700 mt-0.5">
                        Modalidad: <strong>
                          {currentQuoteToPrint.client.deliveryMethod === 'instalacion'
                            ? 'Instalación en Terreno / Obra'
                            : currentQuoteToPrint.client.deliveryMethod === 'entrega'
                              ? 'Entrega en Instalaciones del Cliente'
                              : 'Retiro en Taller (Olivar)'}
                        </strong>
                      </p>
                      {currentQuoteToPrint.client.deliveryAddress && (
                        <p className="text-zinc-700">
                          {currentQuoteToPrint.client.deliveryMethod === 'instalacion' ? 'Lugar Instalación' : 'Dirección Entrega'}: {currentQuoteToPrint.client.deliveryAddress}
                        </p>
                      )}
                    </div>
                    <div>
                      <span className="text-[9px] uppercase font-bold text-zinc-600 tracking-wider block">CONDICIONES COMERCIALES:</span>
                      <p className="text-zinc-800 mt-0.5">WhatsApp / Contacto: {currentQuoteToPrint.client.phone || '-'}</p>
                      <p className="text-zinc-800">Email: {currentQuoteToPrint.client.email || '-'}</p>
                      <p className="text-zinc-800"><strong>Condición de Pago:</strong> {currentQuoteToPrint.client.paymentTerms || 'A convenir'}</p>
                      <p className="text-zinc-800"><strong>Plazo de Fabricación:</strong> {currentQuoteToPrint.client.manufacturingDays || '5 a 7 días hábiles'}</p>
                    </div>
                  </div>

                  {/* Tabla de Trabajos con Detalle y Valor Unitario por Pieza */}
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-black text-white uppercase text-[9px] tracking-wider">
                        <th className="py-2 px-2.5 rounded-l">Cant. / Medidas</th>
                        <th className="py-2 px-2.5">Descripción y Composición del Trabajo</th>
                        <th className="py-2 px-2.5 text-right">Valor Unitario</th>
                        <th className="py-2 px-2.5 text-right rounded-r">Total Neto</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-200">
                      {currentQuoteToPrint.items.map((item, i) => {
                        const unitPricePiece = item.unitPiecePrice || Math.round(item.subtotal / (item.quantity || 1));
                        return (
                          <tr key={i} className="align-top">
                            <td className="py-2 px-2.5 font-mono text-zinc-800">
                              <span className="font-bold text-black block">{item.quantity} ud</span>
                              {item.calcType === 'sqm' ? (
                                <span className="text-[10px] text-zinc-600 block">
                                  <span>{item.width}m × {item.height}m</span>
                                  <span className="no-print print-hide-sqm text-zinc-400"> ({(item.width * item.height * item.quantity).toFixed(2)} m²)</span>
                                </span>
                              ) : (
                                <span className="text-[10px] text-zinc-600 block">{item.unitLabel}</span>
                              )}
                            </td>
                            <td className="py-2 px-2.5">
                              <strong className="text-black block text-xs">{item.name}</strong>
                              {item.detail && (
                                <p className="text-[10px] text-zinc-700 italic mt-0.5 leading-tight">
                                  {item.detail}
                                </p>
                              )}
                              {item.selectedOptions?.length > 0 && (
                                <span className="text-[10px] text-red-600 block mt-0.5">
                                  Acabados: {item.selectedOptions.join(', ')}
                                </span>
                              )}
                            </td>
                            <td className="py-2 px-2.5 text-right font-mono">
                              <div className="font-bold text-black text-xs">{formatCLP(unitPricePiece)} c/u</div>
                              {item.calcType === 'sqm' && (
                                <span className="text-[9px] text-zinc-500 block no-print print-hide-sqm" title="Valor interno de taller ($/m²). Oculto automáticamente en la impresión / PDF del cliente.">
                                  ({formatCLP(item.unitPrice)}/m²)
                                </span>
                              )}
                            </td>
                            <td className="py-2 px-2.5 text-right font-mono font-black text-black text-xs">
                              {formatCLP(item.subtotal)}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>

                  {/* Datos de Transferencia y Resumen Financiero */}
                  <div className="flex flex-col sm:flex-row justify-between items-start gap-4 pt-2 border-t border-zinc-200">
                    <div className="flex-1 bg-zinc-50 p-2.5 rounded-lg border border-zinc-200 text-[10px] leading-relaxed text-zinc-700">
                      <strong className="text-red-600 block uppercase font-bold tracking-wider mb-0.5 text-[9px]">
                        DATOS BANCARIOS PARA TRANSFERENCIA
                      </strong>
                      <p><strong>Razón Social:</strong> {companyInfo.bank.titular} • <strong>RUT:</strong> {companyInfo.bank.rut}</p>
                      <p><strong>Banco:</strong> {companyInfo.bank.banco} • <strong>Cuenta:</strong> {companyInfo.bank.tipo} N° {companyInfo.bank.cuenta}</p>
                      <p><strong>Envío de Comprobante:</strong> {companyInfo.bank.email}</p>
                    </div>

                    <div className="w-full sm:w-64 space-y-1 text-xs text-zinc-800 bg-zinc-50 p-2.5 rounded-lg border border-zinc-200">
                      <div className="flex justify-between py-0.5">
                        <span>Subtotal Neto:</span>
                        <span className="font-mono font-semibold">{formatCLP(currentQuoteToPrint.totals.subtotal)}</span>
                      </div>
                      {currentQuoteToPrint.totals.discountAmount > 0 && (
                        <div className="flex justify-between py-0.5 text-red-600">
                          <span>Descuento Especial:</span>
                          <span className="font-mono">-{formatCLP(currentQuoteToPrint.totals.discountAmount)}</span>
                        </div>
                      )}
                      {currentQuoteToPrint.totals.installationFee > 0 && (
                        <div className="flex justify-between py-0.5 text-zinc-700">
                          <span>Instalación en Terreno:</span>
                          <span className="font-mono font-semibold">+{formatCLP(currentQuoteToPrint.totals.installationFee)}</span>
                        </div>
                      )}
                      {currentQuoteToPrint.totals.freightFee > 0 && (
                        <div className="flex justify-between py-0.5 text-zinc-700">
                          <span>Flete / Traslado:</span>
                          <span className="font-mono font-semibold">+{formatCLP(currentQuoteToPrint.totals.freightFee)}</span>
                        </div>
                      )}
                      {currentQuoteToPrint.totals.taxAmount > 0 && (
                        <div className="flex justify-between py-0.5">
                          <span>IVA (19%):</span>
                          <span className="font-mono">{formatCLP(currentQuoteToPrint.totals.taxAmount)}</span>
                        </div>
                      )}
                      <div className="flex justify-between py-1.5 border-t-2 border-red-600 text-sm font-black text-black">
                        <span>TOTAL A PAGAR:</span>
                        <span className="font-mono text-base text-red-600">{formatCLP(currentQuoteToPrint.totals.total)}</span>
                      </div>
                    </div>
                  </div>

                  {/* Condiciones de Fabricación y Firma Autorizada */}
                  <div className="pt-2 border-t border-zinc-200 grid grid-cols-2 gap-6 text-[10px] text-zinc-600">
                    <div className="space-y-0.5">
                      <strong className="text-black block font-bold text-[10px]">Términos de Fabricación:</strong>
                      <p>• Plazo de fabricación: {currentQuoteToPrint.client.manufacturingDays || '5 a 7 días hábiles'}.</p>
                      <p>• Archivos digitales aportados por cliente vectorizados a curvas (.AI, .PDF o .EPS).</p>
                      <p>• Trabajos garantizados y respaldo técnico directo en taller matriz Olivar.</p>
                    </div>
                    <div className="flex flex-col justify-end items-center text-center">
                      <div className="w-40 border-b border-black mb-1"></div>
                      <span className="font-bold text-black uppercase text-[10px]">Firma y Timbre Autorizado</span>
                      <span className="text-[9px] text-zinc-500 font-bold">{companyInfo.name}</span>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* MODAL FICHA TÉCNICA */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
                <div className="relative h-64">
                  <img src={selectedProject.image} alt={selectedProject.title} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-zinc-950 via-transparent to-transparent"></div>
                  <button onClick={() => setSelectedProject(null)} className="absolute top-4 right-4 bg-black/80 p-2 text-white rounded-full hover:bg-black transition"><Icon name="x" className="w-4 h-4" /></button>
                  <span className="absolute bottom-4 left-6 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full">{selectedProject.category}</span>
                </div>
                <div className="p-6 space-y-4">
                  <div><span className="text-xs font-mono text-red-500 font-bold">{selectedProject.client}</span><h3 className="text-xl font-bold text-white mt-1 font-heading">{selectedProject.title}</h3><p className="text-xs text-zinc-300 mt-2 leading-relaxed">{selectedProject.description}</p></div>
                  <div className="bg-black p-4 rounded-xl border border-zinc-800 grid grid-cols-2 gap-3 text-xs">
                    <div><span className="text-zinc-500 block text-[10px] uppercase font-bold">Materiales:</span><strong className="text-white">{selectedProject.specs.material}</strong></div>
                    {selectedProject.specs.dimensiones && <div><span className="text-zinc-500 block text-[10px] uppercase font-bold">Dimensiones:</span><strong className="text-white">{selectedProject.specs.dimensiones}</strong></div>}
                    <div><span className="text-zinc-500 block text-[10px] uppercase font-bold">Fabricación:</span><strong className="text-white">{selectedProject.specs.tiempoProduccion}</strong></div>
                    <div><span className="text-zinc-500 block text-[10px] uppercase font-bold">Garantía:</span><strong className="text-red-500">{selectedProject.specs.garantia}</strong></div>
                  </div>
                  <div className="flex justify-end gap-3 pt-2">
                    <button onClick={() => setSelectedProject(null)} className="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-bold rounded-xl transition">Cerrar</button>
                    <button onClick={() => handleSelectFromPortfolio(selectedProject)} className="px-5 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-extrabold rounded-xl transition shadow-lg shadow-red-600/30">Cotizar Trabajo Similar</button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
