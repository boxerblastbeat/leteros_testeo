    // --- PRESETS DE MATERIALES ESTÁNDAR DE LETREROS OLIVAR ---
    const MATERIAL_PRESETS = [

      { id: 'trovicel-3mm', name: 'Trovicel / PVC Espumado 3mm (1220 x 2440)', width: 1220, height: 2440, cost: 24000, category: 'PVC' },
      { id: 'trovicel-5mm', name: 'Trovicel / PVC Espumado 5mm (1220 x 2440)', width: 1220, height: 2440, cost: 36000, category: 'PVC' },
      { id: 'trovicel-10mm', name: 'Trovicel / PVC Espumado 10mm (1220 x 2440)', width: 1220, height: 2440, cost: 68000, category: 'PVC' },
      { id: 'acrilico-3mm', name: 'Acrílico Transparente 3mm (1220 x 2440)', width: 1220, height: 2440, cost: 62000, category: 'Acrílico' },
      { id: 'acrilico-jumbo', name: 'Acrílico Blanco Ópalo 4mm (2050 x 3050)', width: 2050, height: 3050, cost: 145000, category: 'Acrílico' },
      { id: 'lata-galv', name: 'Lata Galvanizada 0.8mm (1000 x 3000)', width: 1000, height: 3000, cost: 22000, category: 'Metal' },
      { id: 'policarb-210-290', name: 'Policarbonato Alveolar 6mm (2100 x 2900)', width: 2100, height: 2900, cost: 32000, category: 'Policarbonato' },

    ];

    // Paleta de colores atractiva y contrastante para piezas
    const PIECE_COLORS = [
      '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6',
      '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1',
      '#14b8a6', '#eab308', '#d946ef', '#64748b'

    // --- ALGORITMO DE NESTING 2D GUILLOTINA (BEST SHORT SIDE FIT CON DISCO DE 3MM) ---
    function run2DCutOptimization(sheetW, sheetH, kerf, trim, pieces, globalRotateAllowed) {
      const usableW = Math.max(0, sheetW - (2 * trim));
      const usableH = Math.max(0, sheetH - (2 * trim));

      // Expandir piezas por cantidad
      const expandedPieces = [];
      pieces.forEach((p, pIdx) => {
        const qty = parseInt(p.qty, 10) || 1;
        const w = parseFloat(p.w) || 0;
        const h = parseFloat(p.h) || 0;
        const canRot = globalRotateAllowed && (p.canRotate !== false);
        const color = p.color || PIECE_COLORS[pIdx % PIECE_COLORS.length];

        for (let i = 0; i < qty; i++) {
          expandedPieces.push({
            origId: p.id,
            subId: `${p.id}-${i + 1}`,
            label: p.label || `Pieza ${pIdx + 1}`,
            w,
            h,
            area: (w * h) / 1000000, // m2
            canRotate: canRot,
            color
          });
        }
      });

      // Ordenar piezas por lado mayor y área descendente (Mejor heurística para bin packing)
      expandedPieces.sort((a, b) => {
        const maxA = Math.max(a.w, a.h);
        const maxB = Math.max(b.w, b.h);
        if (maxB !== maxA) return maxB - maxA;
        return (b.w * b.h) - (a.w * a.h);
      });

      const sheets = [];
      const unplaced = [];

      function createNewSheet() {
        return {
          sheetIndex: sheets.length + 1,
          sheetW,
          sheetH,
          usableW,
          usableH,
          trim,
          kerf,
          freeRects: [{ x: trim, y: trim, w: usableW, h: usableH }],
          placed: [],
          offcuts: []
        };
      }

      let activeSheet = createNewSheet();
      sheets.push(activeSheet);

      expandedPieces.forEach((piece) => {
        // Verificar si la pieza cabe físicamente en una plancha vacía
        const fitsNormal = piece.w <= usableW && piece.h <= usableH;
        const fitsRotated = piece.canRotate && piece.h <= usableW && piece.w <= usableH;
        if (!fitsNormal && !fitsRotated) {
          unplaced.push({ ...piece, reason: 'Excede las dimensiones máximas de la plancha' });
          return;
        }

        let placed = false;

        // Intentar colocar en las planchas existentes
        for (let sIdx = 0; sIdx < sheets.length; sIdx++) {
          const sheet = sheets[sIdx];
          let bestRectIdx = -1;
          let bestRotate = false;
          let minShortSide = Infinity;
          let minWaste = Infinity;

          for (let rIdx = 0; rIdx < sheet.freeRects.length; rIdx++) {
            const r = sheet.freeRects[rIdx];

            // 1. Orientación normal
            if (piece.w <= r.w && piece.h <= r.h) {
              const remW = r.w - piece.w;
              const remH = r.h - piece.h;
              const shortSide = Math.min(remW, remH);
              const waste = (r.w * r.h) - (piece.w * piece.h);

              if (shortSide < minShortSide || (shortSide === minShortSide && waste < minWaste)) {
                minShortSide = shortSide;
                minWaste = waste;
                bestRectIdx = rIdx;
                bestRotate = false;
              }
            }

            // 2. Orientación rotada 90°
            if (piece.canRotate && piece.h <= r.w && piece.w <= r.h) {
              const remW = r.w - piece.h;
              const remH = r.h - piece.w;
              const shortSide = Math.min(remW, remH);
              const waste = (r.w * r.h) - (piece.w * piece.h);

              if (shortSide < minShortSide || (shortSide === minShortSide && waste < minWaste)) {
                minShortSide = shortSide;
                minWaste = waste;
                bestRectIdx = rIdx;
                bestRotate = true;
              }
            }
          }

          if (bestRectIdx >= 0) {
            const r = sheet.freeRects.splice(bestRectIdx, 1)[0];
            const pw = bestRotate ? piece.h : piece.w;
            const ph = bestRotate ? piece.w : piece.h;

            sheet.placed.push({
              ...piece,
              x: r.x,
              y: r.y,
              w: pw,
              h: ph,
              isRotated: bestRotate
            });

            // División por guillotina (Shorter Axis Split Rule con Kerf de disco)
            const rightW = r.w - pw - kerf;
            const rightH = r.h;
            const topW = pw;
            const topH = r.h - ph - kerf;

            if (rightW > 0 && r.h > 0) {
              sheet.freeRects.push({ x: r.x + pw + kerf, y: r.y, w: rightW, h: r.h });
            }
            if (topW > 0 && topH > 0) {
              sheet.freeRects.push({ x: r.x, y: r.y + ph + kerf, w: topW, h: topH });
            }

            // Ordenar rectángulos libres para priorizar las esquinas inferiores
            sheet.freeRects.sort((a, b) => (a.y - b.y) || (a.x - b.x));
            placed = true;
            break;
          }
        }

        // Si no cupo en ninguna plancha existente, abrir una nueva plancha
        if (!placed) {
          const newSheet = createNewSheet();
          sheets.push(newSheet);
          const r = newSheet.freeRects.shift();

          const canRotNew = piece.canRotate && piece.h <= r.w && piece.w <= r.h;
          // Preferir orientación que alinee el lado más largo a lo largo de la plancha
          const bestRotate = canRotNew && (piece.h > piece.w);
          const pw = bestRotate ? piece.h : piece.w;
          const ph = bestRotate ? piece.w : piece.h;

          newSheet.placed.push({
            ...piece,
            x: r.x,
            y: r.y,
            w: pw,
            h: ph,
            isRotated: bestRotate
          });

          const rightW = r.w - pw - kerf;
          const topH = r.h - ph - kerf;
          if (rightW > 0) newSheet.freeRects.push({ x: r.x + pw + kerf, y: r.y, w: rightW, h: r.h });
          if (topH > 0) newSheet.freeRects.push({ x: r.x, y: r.y + ph + kerf, w: pw, h: topH });
        }
      });

      // Calcular estadísticas de cada plancha y clasificar retazos útiles (>= 300x300mm o >= 0.12 m2)
      let totalPiecesPlaced = 0;
      let totalCutAreaM2 = 0;
      const sheetAreaM2 = (sheetW * sheetH) / 1000000;

      sheets.forEach((sheet) => {
        let sheetCutArea = 0;
        sheet.placed.forEach((p) => {
          sheetCutArea += (p.w * p.h) / 1000000;
          totalPiecesPlaced++;
        });
        sheet.cutAreaM2 = sheetCutArea;
        sheet.efficiencyPercent = Math.min(100, Math.round((sheetCutArea / sheetAreaM2) * 1000) / 10);
        sheet.wastePercent = Math.max(0, Math.round((100 - sheet.efficiencyPercent) * 10) / 10);

        // Identificar retazos útiles
        sheet.offcuts = sheet.freeRects.filter(r => (r.w >= 250 && r.h >= 250) || ((r.w * r.h) >= 120000));
        sheet.offcuts.sort((a, b) => (b.w * b.h) - (a.w * a.h));

        totalCutAreaM2 += sheetCutArea;
      });

      const totalSheetsCount = sheets.length;
      const totalStockAreaM2 = totalSheetsCount * sheetAreaM2;
      const overallEfficiency = totalStockAreaM2 > 0 ? Math.round((totalCutAreaM2 / totalStockAreaM2) * 1000) / 10 : 0;
      const overallWaste = Math.max(0, Math.round((100 - overallEfficiency) * 10) / 10);

      return {
        sheets,
        unplaced,
        totalPiecesPlaced,
        totalCutAreaM2,
        totalStockAreaM2,
        overallEfficiency,
        overallWaste
      };
    }

    // --- COMPONENTE PRINCIPAL: OPTIMIZADOR DE CORTES DE TALLER ---
    function WorkshopCutOptimizerApp() {
      // Estado de Plancha / Material Stock
      const [selectedPreset, setSelectedPreset] = useState('acm-122-244');
      const [materialName, setMaterialName] = useState('ACM Aluminio Compuesto 3mm');
      const [sheetWidth, setSheetWidth] = useState(1220);
      const [sheetHeight, setSheetHeight] = useState(2440);
      const [sheetCost, setSheetCost] = useState(38000);
      const [stockAvailable, setStockAvailable] = useState(10);

      // Parámetros de Corte de Taller
      const [cuttingKerf, setCuttingKerf] = useState(3); // 3 mm por defecto para disco de corte
      const [trimMargin, setTrimMargin] = useState(5); // 5 mm refilado perimetral
      const [allowRotation, setAllowRotation] = useState(true);

      // Lista de Piezas a Cortar
      const [pieces, setPieces] = useState([
        { id: 'p1', label: 'Letrero Fachada Principal', w: 1800, h: 600, qty: 1, canRotate: true, color: '#ef4444' },
        { id: 'p2', label: 'Tapa Inferior Caja de Luz', w: 1800, h: 180, qty: 1, canRotate: true, color: '#3b82f6' },
        { id: 'p3', label: 'Tapas Laterales Escuadra', w: 600, h: 180, qty: 2, canRotate: true, color: '#10b981' },
        { id: 'p4', label: 'Placa Señalética Acceso', w: 400, h: 300, qty: 4, canRotate: true, color: '#f59e0b' },
        { id: 'p5', label: 'Bandeja Trasera Montaje', w: 850, h: 420, qty: 2, canRotate: true, color: '#8b5cf6' }
      ]);

      // Estado de navegación visual de planchas
      const [activeSheetTab, setActiveSheetTab] = useState(1);
      const [showLabelsOnDiagram, setShowLabelsOnDiagram] = useState(true);
      const [showDimensionsOnDiagram, setShowDimensionsOnDiagram] = useState(true);
      const [showCutLines, setShowCutLines] = useState(true);
      const [selectedPieceHover, setSelectedPieceHover] = useState(null);

      // Datos de Orden de Trabajo (OT)
      const [otFolio, setOtFolio] = useState('OT-TALLER-001');
      const [assignedMaster, setAssignedMaster] = useState('Maestro Juan / Taller Matriz Olivar');
      const [jobDescription, setJobDescription] = useState('Letreros Luminosos & Señalética');

      // Modal para cargar OTs desde Intranet
      const [showOtModal, setShowOtModal] = useState(false);
      const [availableOts, setAvailableOts] = useState([]);

      // Cargar OTs desde localStorage al iniciar
      useEffect(() => {
        try {
          const savedOts = localStorage.getItem('olivar_work_orders');
          if (savedOts) {
            const parsed = JSON.parse(savedOts);
            if (Array.isArray(parsed)) setAvailableOts(parsed);
          }
        } catch(e) {}
      }, []);

      // Manejar cambio de Preset de Material
      const handlePresetChange = (presetId) => {
        setSelectedPreset(presetId);
        const preset = MATERIAL_PRESETS.find(p => p.id === presetId);
        if (preset) {
          setMaterialName(preset.name);
          setSheetWidth(preset.width);
          setSheetHeight(preset.height);
          setSheetCost(preset.cost);
        }
      };

      // Agregar nueva pieza a la lista
      const handleAddPiece = () => {
        const nextId = 'p' + (Date.now() % 10000);
        const nextColor = PIECE_COLORS[pieces.length % PIECE_COLORS.length];
        setPieces([
          ...pieces,
          {
            id: nextId,
            label: `Corte #${pieces.length + 1}`,
            w: 500,
            h: 300,
            qty: 1,
            canRotate: true,
            color: nextColor
          }
        ]);
      };

      // Actualizar campo de una pieza
      const handleUpdatePiece = (idx, field, val) => {
        setPieces(prev => {
          const next = [...prev];
          next[idx] = { ...next[idx], [field]: val };
          return next;
        });
      };

      // Eliminar pieza
      const handleDeletePiece = (idx) => {
        if (pieces.length <= 1) {
          alert('Debe existir al menos una pieza en la lista.');
          return;
        }
        setPieces(pieces.filter((_, i) => i !== idx));
      };

      // Duplicar pieza
      const handleDuplicatePiece = (idx) => {
        const target = pieces[idx];
        const nextColor = PIECE_COLORS[(pieces.length + 1) % PIECE_COLORS.length];
        setPieces([
          ...pieces.slice(0, idx + 1),
          {
            ...target,
            id: 'p' + (Date.now() % 10000),
            label: `${target.label} (Copia)`,
            color: nextColor
          },
          ...pieces.slice(idx + 1)
        ]);
      };

      // Cargar Trabajo de Ejemplo de Taller
      const handleLoadDemoProject = () => {
        handlePresetChange('acm-122-244');
        setCuttingKerf(3);
        setTrimMargin(5);
        setAllowRotation(true);
        setOtFolio('OT-2026-DEMO');
        setJobDescription('Caja Luminosa Bifaz + Cenefa + Señaléticas');

                    <div className="flex items-center justify-between text-xs">
                      <div>

                        </strong>
                        <span className="text-zinc-400 ml-2 font-mono text-[11px]">
                          ({currentSheet.sheetW} mm de ancho × {currentSheet.sheetH} mm de largo)
                        </span>
                      </div>
                      <div className="flex items-center gap-2 font-mono text-xs">
                        <span className="text-emerald-400 font-bold">
                          {currentSheet.placed.length} piezas
                        </span>
                        <span className="text-zinc-600">•</span>
                        <span className="text-zinc-300">
                          {currentSheet.efficiencyPercent}% utilizado
                        </span>
                        <button
                          type="button"
                          onClick={handlePrint}
                          className="ml-3 px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white font-sans text-xs font-bold flex items-center gap-1.5 transition border border-zinc-700 cursor-pointer shadow-sm"

                          <Icon name="printer" className="w-3.5 h-3.5 text-red-500" />
                          <span>Imprimir Plano A4</span>
                        </button>
                      </div>
                    </div>

                    {/* LIENZO VECTORIAL SVG CON COTAS Y NESTING A ESCALA */}
                    <div className="w-full bg-[#070709] border border-zinc-800 rounded-xl p-3 overflow-hidden flex items-center justify-center">
                      {(() => {
                        // Dimensiones para el viewBox del SVG
                        const padX = 60; // margen exterior para reglas
                        const padY = 45;
                        const svgW = 1000;
                        const drawW = svgW - (padX * 2);
                        const scale = drawW / currentSheet.sheetW;
                        const drawH = currentSheet.sheetH * scale;
                        const svgH = drawH + (padY * 2);

                        return (
                          <svg
                            viewBox={`0 0 ${svgW} ${svgH}`}
                            className="w-full h-auto max-h-[620px] select-none"
                            style={{ filter: 'drop-shadow(0 10px 25px rgba(0,0,0,0.5))' }}
                          >
                            {/* Fondo de la plancha completa (Borde exterior de stock) */}
                            <rect
                              x={padX}
                              y={padY}
                              width={drawW}
                              height={drawH}
                              fill="#18181f"
                              stroke="#52525b"
                              strokeWidth="2"
                              rx="3"
                            />

                            {/* Margen de refilado perimetral (Trim) con línea discontinua */}
                            {currentSheet.trim > 0 && (
                              <rect
                                x={padX + (currentSheet.trim * scale)}
                                y={padY + (currentSheet.trim * scale)}
                                width={drawW - (2 * currentSheet.trim * scale)}
                                height={drawH - (2 * currentSheet.trim * scale)}
                                fill="none"
                                stroke="#dc2626"
                                strokeWidth="1"
                                strokeDasharray="4 3"
                                opacity="0.6"
                              />
                            )}

                            {/* Áreas de Retazos Útiles (Offcuts) sombreadas en verde oliva */}
                            {currentSheet.offcuts.map((off, oIdx) => (
                              <g key={`off-${oIdx}`}>
                                <rect
                                  x={padX + (off.x * scale)}
                                  y={padY + (off.y * scale)}
                                  width={off.w * scale}
                                  height={off.h * scale}
                                  fill="#14532d"
                                  fillOpacity="0.25"
                                  stroke="#22c55e"
                                  strokeWidth="1"
                                  strokeDasharray="3 3"
                                />
                                {off.w * scale > 60 && off.h * scale > 30 && (
                                  <text
                                    x={padX + (off.x * scale) + (off.w * scale / 2)}
                                    y={padY + (off.y * scale) + (off.h * scale / 2) + 4}
                                    fill="#4ade80"
                                    fontSize="11"
                                    fontFamily="JetBrains Mono"
                                    fontWeight="bold"
                                    textAnchor="middle"
                                    opacity="0.9"
                                  >
                                    Retazo {Math.round(off.w)}×{Math.round(off.h)}mm
                                  </text>
                                )}
                              </g>
                            ))}

                            {/* Piezas cortadas colocadas */}
                            {currentSheet.placed.map((piece, pIdx) => {
                              const px = padX + (piece.x * scale);
                              const py = padY + (piece.y * scale);
                              const pw = piece.w * scale;
                              const ph = piece.h * scale;
                              const isHovered = selectedPieceHover === piece.subId;

                              return (
                                <g
                                  key={piece.subId}
                                  onMouseEnter={() => setSelectedPieceHover(piece.subId)}
                                  onMouseLeave={() => setSelectedPieceHover(null)}
                                  className="cursor-pointer transition-opacity"
                                >
                                  {/* Rectángulo de la pieza con su color */}
                                  <rect
                                    x={px}
                                    y={py}
                                    width={pw}
                                    height={ph}
                                    fill={piece.color}
                                    fillOpacity={isHovered ? 0.95 : 0.85}
                                    stroke={isHovered ? '#ffffff' : '#0a0a0c'}
                                    strokeWidth={isHovered ? 2.5 : 1.5}
                                    rx="2"
                                  />

                                  {/* Línea de corte / Sangría de disco visible si se activa */}
                                  {showCutLines && cuttingKerf > 0 && (
                                    <>
                                      <line
                                        x1={px + pw}
                                        y1={py}
                                        x2={px + pw}
                                        y2={py + ph}
                                        stroke="#f87171"
                                        strokeWidth={Math.max(1.5, cuttingKerf * scale)}
                                        opacity="0.4"
                                      />
                                      <line
                                        x1={px}
                                        y1={py + ph}
                                        x2={px + pw}
                                        y2={py + ph}
                                        stroke="#f87171"
                                        strokeWidth={Math.max(1.5, cuttingKerf * scale)}
                                        opacity="0.4"
                                      />
                                    </>
                                  )}

                                  {/* Etiqueta y Dimensiones legibles dentro de la pieza */}
                                  {pw > 45 && ph > 25 && (
                                    <g>
                                      {/* Número de corte */}
                                      <circle
                                        cx={px + 14}
                                        cy={py + 14}
                                        r="9"
                                        fill="#000000"
                                        fillOpacity="0.75"
                                      />
                                      <text
                                        x={px + 14}
                                        y={py + 17.5}
                                        fill="#ffffff"
                                        fontSize="10"
                                        fontFamily="JetBrains Mono"
                                        fontWeight="bold"
                                        textAnchor="middle"
                                      >
                                        {pIdx + 1}
                                      </text>

                                      {/* Nombre / Descripción */}
                                      {showLabelsOnDiagram && pw > 90 && ph > 35 && (
                                        <text
                                          x={px + pw / 2}
                                          y={py + (ph / 2) - 2}
                                          fill="#ffffff"
                                          fontSize={Math.min(13, Math.max(9, pw / 15))}
                                          fontFamily="Plus Jakarta Sans"
                                          fontWeight="bold"
                                          textAnchor="middle"
                                          style={{ textShadow: '0 1px 3px rgba(0,0,0,0.9)' }}
                                        >
                                          {piece.label}
                                        </text>
                                      )}

                                      {/* Dimensiones Milimétricas */}
                                      {showDimensionsOnDiagram && (
                                        <text
                                          x={px + pw / 2}
                                          y={showLabelsOnDiagram && ph > 35 ? (py + (ph / 2) + 14) : (py + (ph / 2) + 4)}
                                          fill="#ffffff"
                                          fontSize="11"
                                          fontFamily="JetBrains Mono"
                                          fontWeight="600"
                                          textAnchor="middle"
                                          opacity="0.95"
                                          style={{ textShadow: '0 1px 3px rgba(0,0,0,0.9)' }}
                                        >
                                          {Math.round(piece.w)} × {Math.round(piece.h)} mm
                                          {piece.isRotated ? ' ⟳' : ''}
                                        </text>
                                      )}
                                    </g>
                                  )}

                                </g>
                              );
                            })}

                            {/* REGLAS MILIMÉTRICAS EXTERIORES */}
                            {/* Regla Superior (Ancho) */}
                            <line
                              x1={padX}
                              y1={padY - 14}
                              x2={padX + drawW}
                              y2={padY - 14}
                              stroke="#71717a"
                              strokeWidth="1.5"
                            />
                            <line x1={padX} y1={padY - 20} x2={padX} y2={padY - 8} stroke="#71717a" strokeWidth="1.5" />
                            <line x1={padX + drawW} y1={padY - 20} x2={padX + drawW} y2={padY - 8} stroke="#71717a" strokeWidth="1.5" />
                            <text
                              x={padX + (drawW / 2)}
                              y={padY - 20}
                              fill="#d4d4d8"
                              fontSize="12"
                              fontFamily="JetBrains Mono"
                              fontWeight="bold"
                              textAnchor="middle"
                            >
                              ANCHO: {currentSheet.sheetW} mm
                            </text>

                            {/* Regla Izquierda (Largo/Alto) */}
                            <line
                              x1={padX - 16}
                              y1={padY}
                              x2={padX - 16}
                              y2={padY + drawH}
                              stroke="#71717a"
                              strokeWidth="1.5"
                            />
                            <line x1={padX - 22} y1={padY} x2={padX - 10} y2={padY} stroke="#71717a" strokeWidth="1.5" />
                            <line x1={padX - 22} y1={padY + drawH} x2={padX - 10} y2={padY + drawH} stroke="#71717a" strokeWidth="1.5" />
                            <text
                              x={padX - 26}
                              y={padY + (drawH / 2)}
                              fill="#d4d4d8"
                              fontSize="12"
                              fontFamily="JetBrains Mono"
                              fontWeight="bold"
                              textAnchor="middle"
                              transform={`rotate(-90, ${padX - 26}, ${padY + (drawH / 2)})`}
                            >
                              LARGO: {currentSheet.sheetH} mm
                            </text>

                          </svg>
                        );
                      })()}
                    </div>

                    {/* Leyenda y Detalles de la Plancha Activa */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs pt-1">
                      
                      {/* Piezas en esta plancha */}
                      <div className="p-3 rounded-xl bg-zinc-950/70 border border-zinc-800">
                        <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider block mb-2">
                          Piezas a Cortar en Plancha #{currentSheet.sheetIndex}:
                        </span>
                        <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                          {currentSheet.placed.map((p, idx) => (
                            <div
                              key={p.subId}
                              className={`flex items-center justify-between p-1.5 rounded-lg text-[11px] transition ${
                                selectedPieceHover === p.subId ? 'bg-zinc-800 text-white font-bold' : 'text-zinc-300 hover:bg-zinc-900'
                              }`}
                            >
                              <div className="flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: p.color }}></span>
                                <span>#{idx + 1} {p.label}</span>
                              </div>
                              <span className="font-mono text-zinc-400">
                                {Math.round(p.w)}×{Math.round(p.h)}mm {p.isRotated ? '(Giro 90°)' : ''}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Retazos útiles para bodega */}
                      <div className="p-3 rounded-xl bg-zinc-950/70 border border-zinc-800">
                        <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block mb-2">
                          ♻️ Retazos Útiles Sobrantes (Bodega):
                        </span>
                        {currentSheet.offcuts.length > 0 ? (
                          <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                            {currentSheet.offcuts.map((off, oIdx) => (
                              <div key={oIdx} className="flex items-center justify-between p-1.5 rounded-lg bg-emerald-950/20 border border-emerald-900/40 text-[11px] text-emerald-300 font-mono">
                                <span>Retazo #{oIdx + 1}</span>
                                <strong>{Math.round(off.w)} mm × {Math.round(off.h)} mm ({((off.w * off.h)/1000000).toFixed(2)} m²)</strong>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <p className="text-[11px] text-zinc-500 italic">
                            No quedan retazos mayores a 250×250mm en esta plancha (Aprovechamiento óptimo).
                          </p>
                        )}
                      </div>

                    </div>

                  </div>
                )}

              </div>

            </div>

          </main>

                    {/* ========================================================================= */}
          {/* PLANO TÉCNICO DE CORTE 2D PARA TALLER / PDF (ID: print-area)              */}
          {/* Formato A4 profesional: Trazos nítidos, cotas milimétricas, sin colores   */}
          {/* ========================================================================= */}
          <div id="print-area" className="bg-white text-black font-sans text-xs">
            {optimizationResults.sheets.map((sheet, sIdx) => {
              const padLeft = 85;
              const padTop = 60;
              const padRight = 35;
              const padBottom = 50;
              const totalW = sheet.sheetW + padLeft + padRight;
              const totalH = sheet.sheetH + padTop + padBottom;

              return (
                <div key={sheet.sheetIndex} className="print-sheet-page p-4 bg-white text-black space-y-3">
                  
                  {/* Membrete Oficial en Alta Calidad con Logo Negro para Fondo Blanco */}
                  <div className="flex justify-between items-start border-b-2 border-red-600 pb-2">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <BrandLogo theme="light" className="h-10 w-auto" />
                        <span className="text-[10px] font-bold text-zinc-600 font-mono">SpA</span>
                      </div>
                      <p className="text-[10px] text-gray-700 font-bold uppercase tracking-wide">
                        Taller Matriz de Fabricación Gráfica, Estructuras & Publicidad
                      </p>
                      <p className="text-[9px] text-gray-500 font-mono">
                        RUT: 77.892.486-5 • Fono: +56 9 5158 5884 • Olivar, Región de O'Higgins
                      </p>
                    </div>
                    <div className="text-right">
                      <div className="inline-block bg-black text-white px-3 py-1 font-mono font-black text-xs rounded mb-1">
                        PLANO TÉCNICO DE CORTE 2D
                      </div>
                      <p className="text-[10px] text-gray-800 font-mono">
                        <strong>OT:</strong> {otFolio} • <strong>Plancha:</strong> {sheet.sheetIndex} de {optimizationResults.sheets.length}
                      </p>
                      <p className="text-[10px] text-gray-700"><strong>Fecha:</strong> {new Date().toLocaleDateString('es-CL')}</p>
                      <p className="text-[10px] text-red-600 font-bold"><strong>Maestro:</strong> {assignedMaster}</p>
                    </div>
                  </div>

                  {/* Ficha Resumen Técnico de la Plancha */}
                  <div className="grid grid-cols-3 gap-2 p-2 bg-gray-50 rounded border border-gray-300 text-[10px] leading-tight">
                    <div>
                      <span className="text-[8px] uppercase font-bold text-gray-500 block">Sustrato Matriz:</span>
                      <strong className="text-[11px] text-black block">{materialName}</strong>
                      <p className="text-gray-700 font-mono">Formato: {sheet.sheetW} × {sheet.sheetH} mm • Refilado: {sheet.trim} mm</p>
                    </div>
                    <div>
                      <span className="text-[8px] uppercase font-bold text-gray-500 block">Parámetros de Sierra:</span>
                      <p className="text-gray-800 font-mono">

                      </p>
                      <p className="text-gray-700 font-mono">
                        Piezas en plancha: <strong>{sheet.placed.length} ud</strong>
                      </p>
                    </div>
                    <div>
                      <span className="text-[8px] uppercase font-bold text-gray-500 block">Rendimiento Técnico:</span>
                      <p className="text-emerald-700 font-bold font-mono">

                      </p>
                      <p className="text-gray-600 font-mono">

                      </p>
                    </div>
                  </div>

                  {/* DIAGRAMA TÉCNICO CAD: SOLO TRAZOS Y COTAS (SIN COLORES DE FONDO) */}
                  <div className="border border-black rounded p-2 bg-white flex justify-center">
                    <svg
                      viewBox={`-${padLeft} -${padTop} ${totalW} ${totalH}`}
                      className="w-full h-auto max-h-[380px] bg-white select-none"
                      shapeRendering="geometricPrecision"
                    >
                      {/* Fondo 100% blanco puro (sin gasto de tinta) */}
                      <rect x={-padLeft} y={-padTop} width={totalW} height={totalH} fill="#ffffff" />

                      {/* Contorno Plancha Matriz */}
                      <rect x="0" y="0" width={sheet.sheetW} height={sheet.sheetH} fill="#ffffff" stroke="#000000" strokeWidth="2.5" />

                      {/* Cota Exterior Superior: Ancho Total */}
                      <line x1="0" y1="-32" x2={sheet.sheetW} y2="-32" stroke="#000000" strokeWidth="2" />
                      <line x1="-8" y1="-24" x2="8" y2="-40" stroke="#000000" strokeWidth="2.5" />
                      <line x1={sheet.sheetW - 8} y1="-24" x2={sheet.sheetW + 8} y2="-40" stroke="#000000" strokeWidth="2.5" />
                      <line x1="0" y1="-45" x2="0" y2="0" stroke="#000000" strokeWidth="1" strokeDasharray="4 3" />
                      <line x1={sheet.sheetW} y1="-45" x2={sheet.sheetW} y2="0" stroke="#000000" strokeWidth="1" strokeDasharray="4 3" />
                      <text x={sheet.sheetW / 2} y="-38" textAnchor="middle" fill="#000000" fontSize="22" fontFamily="monospace" fontWeight="bold">
                        ↔ ANCHO PLANCHA: {sheet.sheetW} mm
                      </text>

                      {/* Cota Exterior Izquierda: Largo / Alto Total */}
                      <line x1="-36" y1="0" x2="-36" y2={sheet.sheetH} stroke="#000000" strokeWidth="2" />
                      <line x1="-44" y1="8" x2="-28" y2="-8" stroke="#000000" strokeWidth="2.5" />
                      <line x1="-44" y1={sheet.sheetH + 8} x2="-28" y2={sheet.sheetH - 8} stroke="#000000" strokeWidth="2.5" />
                      <line x1="-48" y1="0" x2="0" y2="0" stroke="#000000" strokeWidth="1" strokeDasharray="4 3" />
                      <line x1="-48" y1={sheet.sheetH} x2="0" y2={sheet.sheetH} stroke="#000000" strokeWidth="1" strokeDasharray="4 3" />
                      <text x="-44" y={sheet.sheetH / 2} textAnchor="middle" fill="#000000" fontSize="22" fontFamily="monospace" fontWeight="bold" transform={`rotate(-90, -44, ${sheet.sheetH / 2})`}>
                        ↕ LARGO PLANCHA: {sheet.sheetH} mm
                      </text>

                      {/* Línea de Refilado Perimetral */}
                      {sheet.trim > 0 && (
                        <g>
                          <rect
                            x={sheet.trim}
                            y={sheet.trim}
                            width={sheet.sheetW - (2 * sheet.trim)}

                            stroke="#555555"
                            strokeWidth="1.5"
                            strokeDasharray="8 5"
                          />
                          <text x={sheet.trim + 8} y={sheet.trim - 8} fill="#555555" fontSize="15" fontFamily="monospace" fontWeight="bold">
                            Refilado perimetral: {sheet.trim} mm
                          </text>
                        </g>
                      )}

                      {/* Retazos Sobrantes Útiles (Offcuts) */}
                      {sheet.offcuts.map((off, oIdx) => (
                        <g key={`print-off-${oIdx}`}>
                          <rect
                            x={off.x}
                            y={off.y}

                            height={off.h}
                            fill="none"
                            stroke="#666666"
                            strokeWidth="1.5"
                            strokeDasharray="6 4"
                          />
                          {off.w >= 100 && off.h >= 60 && (

                              x={off.x + (off.w / 2)}
                              y={off.y + (off.h / 2)}
                              textAnchor="middle"
                              fill="#555555"
                              fontSize="16"
                              fontFamily="monospace"
                              fontWeight="bold"
                            >
                              RETAZO: {Math.round(off.w)}×{Math.round(off.h)} mm
                            </text>
                          )}
                        </g>
                      ))}

                      {/* Piezas Cortadas (Solo trazos negros nítidos sobre fondo blanco, cotas y medidas) */}
                      {sheet.placed.map((p, idx) => {
                        const pw = p.w;
                        const ph = p.h;
                        const px = p.x;
                        const py = p.y;

                        return (
                          <g key={`print-piece-${p.subId}`}>
                            {/* Rectángulo de la pieza (Sin relleno de color, trazo negro) */}
                            <rect
                              x={px}
                              y={py}
                              width={pw}
                              height={ph}
                              fill="#ffffff"
                              stroke="#000000"
                              strokeWidth="2"
                            />

                            {/* Canal / Trazo de Corte con Sierra (Kerf) */}
                            {cuttingKerf > 0 && (
                              <>
                                <line
                                  x1={px + pw}
                                  y1={py}
                                  x2={px + pw}
                                  y2={py + ph}
                                  stroke="#000000"
                                  strokeWidth="1.5"
                                  strokeDasharray="4 3"
                                />
                                <line
                                  x1={px}
                                  y1={py + ph}
                                  x2={px + pw}
                                  y2={py + ph}
                                  stroke="#000000"
                                  strokeWidth="1.5"
                                  strokeDasharray="4 3"
                                />
                              </>
                            )}

                            {/* Badge Número de Corte */}

                              y={py + 8}
                              width="34"
                              height="26"

                              fill="#000000"
                            />
                            <text
                              x={px + 25}
                              y={py + 26}
                              textAnchor="middle"
                              fill="#ffffff"
                              fontSize="15"
                              fontFamily="monospace"
                              fontWeight="bold"
                            >
                              #{idx + 1}
                            </text>

                            {/* Cota Superior Interna si hay espacio */}
                            {pw >= 140 && (
                              <g>
                                <line
                                  x1={px + 48}
                                  y1={py + 20}
                                  x2={px + pw - 12}
                                  y2={py + 20}
                                  stroke="#333333"
                                  strokeWidth="1"
                                />
                                <line x1={px + 45} y1={py + 24} x2={px + 51} y2={py + 16} stroke="#000000" strokeWidth="1.5" />
                                <line x1={px + pw - 15} y1={py + 24} x2={px + pw - 9} y2={py + 16} stroke="#000000" strokeWidth="1.5" />
                                <text
                                  x={px + 48 + ((pw - 60) / 2)}
                                  y={py + 16}
                                  textAnchor="middle"
                                  fill="#000000"
                                  fontSize="12"
                                  fontFamily="monospace"
                                  fontWeight="bold"
                                >
                                  {Math.round(pw)} mm
                                </text>
                              </g>

                            {/* Cota Lateral Derecha Interna si hay espacio */}
                            {ph >= 120 && (
                              <g>
                                <line
                                  x1={px + pw - 16}
                                  y1={py + 32}
                                  x2={px + pw - 16}
                                  y2={py + ph - 16}
                                  stroke="#333333"
                                  strokeWidth="1"
                                />
                                <line x1={px + pw - 20} y1={py + 36} x2={px + pw - 12} y2={py + 28} stroke="#000000" strokeWidth="1.5" />
                                <line x1={px + pw - 20} y1={py + ph - 12} x2={px + pw - 12} y2={py + ph - 20} stroke="#000000" strokeWidth="1.5" />
                                <text
                                  x={px + pw - 22}
                                  y={py + (ph / 2)}
                                  textAnchor="middle"
                                  fill="#000000"
                                  fontSize="12"
                                  fontFamily="monospace"
                                  fontWeight="bold"
                                  transform={`rotate(-90, ${px + pw - 22}, ${py + (ph / 2)})`}
                                >
                                  {Math.round(ph)} mm
                                </text>
                              </g>
                            )}

                            {/* Identificación y Medidas de la Pieza */}
                            <text
                              x={px + (pw / 2)}
                              y={py + (ph / 2) - 12}
                              textAnchor="middle"
                              fill="#000000"
                              fontSize={Math.min(22, Math.max(13, pw / 20))}
                              fontFamily="sans-serif"
                              fontWeight="bold"
                            >
                              {p.label}
                            </text>

                            <text
                              x={px + (pw / 2)}
                              y={py + (ph / 2) + 12}
                              textAnchor="middle"
                              fill="#000000"
                              fontSize="18"
                              fontFamily="monospace"
                              fontWeight="bold"
                            >
                              {Math.round(pw)} × {Math.round(ph)} mm {p.isRotated ? ' ⟳ (Giro 90°)' : ''}
                            </text>

                            <text
                              x={px + (pw / 2)}
                              y={py + (ph / 2) + 32}
                              textAnchor="middle"
                              fill="#444444"
                              fontSize="13"
                              fontFamily="monospace"
                            >
                              Tope Sierra: X={Math.round(px)} mm • Y={Math.round(py)} mm
                            </text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>

                  {/* Tabla de Piezas para Marcar Conforme se Cortan */}
                  <table className="w-full text-left text-[9px] border-collapse">
                    <thead>
                      <tr className="border-b-2 border-black font-bold bg-gray-100">
                        <th className="p-1 text-center w-10">Corte OK</th>
                        <th className="p-1">#</th>
                        <th className="p-1">Descripción de Pieza</th>
                        <th className="p-1 font-mono">Ancho (mm)</th>
                        <th className="p-1 font-mono">Alto (mm)</th>
                        <th className="p-1 font-mono">Tope Sierra (X, Y)</th>
                        <th className="p-1">Giro 90°</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sheet.placed.map((p, idx) => (
                        <tr key={p.subId} className="border-b border-gray-300">
                          <td className="p-1 text-center">
                            <div className="w-4 h-4 border border-black rounded-sm mx-auto"></div>
                          </td>
                          <td className="p-1 font-mono font-bold">#{idx + 1}</td>
                          <td className="p-1 font-semibold">{p.label}</td>
                          <td className="p-1 font-mono font-bold">{Math.round(p.w)} mm</td>
                          <td className="p-1 font-mono font-bold">{Math.round(p.h)} mm</td>
                          <td className="p-1 font-mono text-gray-700">X={Math.round(p.x)}, Y={Math.round(p.y)} mm</td>
                          <td className="p-1 text-gray-700">{p.isRotated ? 'SÍ (Giro 90°)' : 'NO'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  {/* Firmas de Control de Calidad y Maestro de Sierra */}
                  <div className="pt-4 grid grid-cols-2 gap-8 text-center text-[10px] page-break-inside-avoid">
                    <div>
                      <div className="border-b border-black w-48 mx-auto mb-1"></div>
                      <strong>Firma Maestro de Sierra / Dimensionado</strong>
                      <p className="text-gray-600">Verificación de escuadra y medidas de corte</p>
                    </div>
                    <div>
                      <div className="border-b border-black w-48 mx-auto mb-1"></div>
                      <strong>Control de Calidad / Taller Matriz</strong>
                      <p className="text-gray-600">Inspección de bordes, refilado y recepción</p>
                    </div>
                  </div>

                </div>
              );
            })}
          </div>

          {/* ============================================================== */}
          {/* MODAL: CARGAR TRABAJO DESDE ORDEN DE TRABAJO (INTRANET)        */}
          {/* ============================================================== */}
          {showOtModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 no-print">
              <div className="bg-[#111116] border border-zinc-800 rounded-2xl w-full max-w-xl p-6 space-y-4 shadow-2xl">
                
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-red-600 text-white flex items-center justify-center font-bold">
                      <Icon name="layers" className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white font-heading">
                        Cargar Piezas desde Orden de Trabajo (OT)
                      </h3>
                      <p className="text-[11px] text-zinc-400">
                        Selecciona una OT activa para transferir sus cortes al optimizador
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowOtModal(false)}
                    className="text-zinc-500 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                  {availableOts.length > 0 ? (
                    availableOts.map((ot) => (
                      <div
                        key={ot.id || ot.otFolio}
                        onClick={() => handleLoadFromOt(ot)}
                        className="p-3 rounded-xl bg-zinc-950/80 hover:bg-zinc-900 border border-zinc-800/80 hover:border-red-500/50 transition cursor-pointer flex items-center justify-between gap-3"
                      >
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-mono font-bold text-xs text-red-400">{ot.otFolio}</span>
                            <span className="text-xs text-white font-semibold">{ot.client?.name || 'Cliente Taller'}</span>
                          </div>
                          <p className="text-[11px] text-zinc-400 mt-0.5">
                            {(ot.items || []).length} trabajos • Entrega: {ot.deadline || 'Coordinada'}
                          </p>
                        </div>
                        <button
                          type="button"
                          className="px-2.5 py-1 rounded-lg bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white text-[11px] font-bold border border-red-500/30 transition"
                        >
                          Cargar &rarr;
                        </button>
                      </div>
                    ))
                  ) : (
                    <div className="p-8 text-center text-zinc-500 text-xs">
                      No hay órdenes de trabajo guardadas en este navegador. Puedes ingresar las piezas manualmente en la tabla.
                    </div>
                  )}
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    type="button"
                    onClick={() => setShowOtModal(false)}
                    className="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold transition"
                  >
                    Cerrar
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER DEL SISTEMA */}
          <footer className="border-t border-zinc-800/80 py-4 px-6 text-center text-xs text-zinc-600 no-print">
            <p>
              &copy; 2026 Letreros Olivar SpA • Taller Matriz de Fabricación • Optimizador de Cortes 2D con Sangría de Sierra ({cuttingKerf} mm)
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WorkshopCutOptimizerApp />);
  </script>
</body>
</html>
